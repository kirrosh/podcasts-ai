[project]
name = "podcasts-ai"
version = "0.1.0"
description = "Russian educational audio podcast generator with Obsidian LLM Wiki and modular TTS providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "grpcio>=1.68",
    "yandexcloud>=0.320",
    # torch is a transitive dep of ruaccent but must be explicit — without it
    # RUAccent silently falls back to dictionary-only mode and mangles homographs.
    "ruaccent>=1.5",
    "torch>=2.4",
    "pydub>=0.25",
    "ebooklib>=0.18",
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-slugify>=8.0",
    "f5-tts>=1.1.17",
    "soundfile>=0.13.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
podcasts-build = "podcasts.build:main"
podcasts-transcribe = "podcasts.transcribe:main"
podcasts-ingest = "podcasts.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcasts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
